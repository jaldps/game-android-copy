name: Bowbrawl smoke test and Android APK

on:
  push:
    branches:
      - feat/bowbrawl-visual-rebuild
    paths:
      - "web/games/archer/**"
      - ".github/workflows/bowbrawl-build.yml"
      - "android/**"
      - "tools/apk.sh"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "web/games/archer/**"
      - ".github/workflows/bowbrawl-build.yml"
      - "android/**"
      - "tools/apk.sh"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bowbrawl-build-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install a headless browser
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium

      - name: Start local game server
        if: github.event_name != 'push'
        run: |
          node tools/serve.mjs 8080 > /tmp/bowbrawl-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/games/archer/index.html" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bowbrawl-server.log
          exit 1

      - name: Run menu, controls, turn-loop and rendering smoke tests
        if: github.event_name != 'push'
        run: |
          mkdir -p artifacts
          cat > bowbrawl-smoke.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox', '--use-gl=angle', '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist']
          });
          const errors = [];
          const page = await browser.newPage({
            viewport: { width: 1365, height: 768 }, deviceScaleFactor: 1
          });
          page.on('pageerror', e => errors.push('pageerror: ' + e.message));
          page.on('console', m => {
            if (m.type() === 'error') errors.push('console: ' + m.text());
          });

          const base = 'http://127.0.0.1:8080/games/archer/index.html';
          const nav = await page.goto(base + '?scene=menu&seed=73', { waitUntil: 'load', timeout: 90000 });
          assert(nav && nav.ok(), 'Bowbrawl menu route failed to load');
          await page.waitForFunction(() => window.__game && window.__game.getSnapshot, null, { timeout: 60000 });
          await page.waitForTimeout(1800);
          assert.equal((await page.evaluate(() => window.__game.state.screen)), 'menu', 'menu scene hook failed');
          await page.screenshot({ path: 'artifacts/bowbrawl-menu.png' });

          await page.locator('#startBtn').click();
          await page.waitForFunction(() => window.__game.state.screen === 'play');
          await page.locator('#angle').focus();
          const angleBefore = await page.evaluate(() => window.__game.state.angle);
          await page.keyboard.press('ArrowRight');
          const angleAfter = await page.evaluate(() => window.__game.state.angle);
          assert.notEqual(angleAfter, angleBefore, 'angle control did not change the ballistic aim');

          await page.locator('[data-arrow="ember"]').click();
          assert.equal(await page.evaluate(() => window.__game.state.selectedArrow), 'ember', 'arrowhead selection failed');
          await page.screenshot({ path: 'artifacts/bowbrawl-ready.png' });

          await page.locator('#pauseBtn').click();
          assert.equal(await page.evaluate(() => window.__game.state.screen), 'paused', 'pause button failed');
          await page.locator('#resumeBtn').click();
          assert.equal(await page.evaluate(() => window.__game.state.screen), 'play', 'resume button failed');

          await page.locator('#fireBtn').click();
          // Advance simulated time independently from SwiftShader's render speed.
          await page.evaluate(() => window.__game.step(36));
          const firstTurn = await page.evaluate(() => window.__game.getSnapshot());
          assert(firstTurn.shots >= 1, 'firing did not increment the shot counter');
          await page.screenshot({ path: 'artifacts/bowbrawl-first-shot.png' });

          const afterAI = await page.evaluate(() => window.__game.step(600));
          assert(afterAI.shots >= 2 || afterAI.screen === 'over', 'AI failed to take its reply shot');
          assert(afterAI.turn === 'player' || afterAI.screen === 'over', 'turn did not return to player after AI shot');
          await page.screenshot({ path: 'artifacts/bowbrawl-live-duel.png' });

          await page.goto(base + '?autoplay=1&warp=4&fixedstep=1&seed=3', { waitUntil: 'load', timeout: 90000 });
          await page.waitForFunction(() => window.__game && window.__game.state.screen === 'play', null, { timeout: 60000 });
          const autoplay = await page.evaluate(() => window.__game.getSnapshot());
          assert(autoplay.shots >= 1, 'autoplay/warp test did not advance the duel');
          await page.waitForTimeout(800);
          await page.screenshot({ path: 'artifacts/bowbrawl-autoplay.png' });

          assert.deepEqual(errors, [], 'browser console/page errors found');
          await browser.close();
          console.log('PASS: menu, WebGL scene, sliders, arrow type, pause/resume, shot physics, AI turn and autoplay hooks');
          NODE
          node bowbrawl-smoke.mjs
          rm -f bowbrawl-smoke.mjs

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35 packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build the full release APK
        run: |
          mkdir -p artifacts
          bash tools/apk.sh
          test -s dist/ClearplayArcade.apk
          unzip -l dist/ClearplayArcade.apk | grep -q "assets/games/archer/index.html"
          unzip -p dist/ClearplayArcade.apk assets/games/archer/index.html | grep -q "SKYFALL CIRCUIT"
          sha256sum dist/ClearplayArcade.apk | tee artifacts/apk-sha256.txt
          ls -lh dist/ClearplayArcade.apk

      - name: Update the tracked APK on the feature branch
        if: github.event_name == 'push' && github.ref_name == 'feat/bowbrawl-visual-rebuild'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ClearplayArcade.apk
          if git diff --cached --quiet; then
            echo "APK bytes match the current tracked build; no binary commit needed."
          else
            git commit -m "Build Clearplay Arcade APK with Bowbrawl"
            git push origin HEAD:feat/bowbrawl-visual-rebuild
          fi

      - name: Upload screenshots and installable APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bowbrawl-review-and-apk
          path: |
            artifacts/
            dist/ClearplayArcade.apk
          if-no-files-found: warn
          retention-days: 14
