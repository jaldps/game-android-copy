name: Bowbrawl WOW critic
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_bowbrawl_v4.mjs'
      - '.github/workflows/bowbrawl-wow.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bowbrawl-wow-main
  cancel-in-progress: true
jobs:
  overhaul-and-critic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Apply the complete v4 game pass
        run: node tools/patch_bowbrawl_v4.mjs
      - name: JavaScript syntax gate
        run: node --check web/games/archer/main.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Harsh critic - gameplay and presentation gate
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:810},deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>m.type()==='error'&&errors.push(m.text()));
            const base='http://127.0.0.1:8080/games/archer/index.html';
            const {spawn}=require('node:child_process'); const server=spawn('node',['tools/serve.mjs','8080'],{stdio:'ignore'});
            try{
              await page.goto(base+'?seed=101',{waitUntil:'load',timeout:60000});
              await page.waitForFunction(()=>window.__game?.getSnapshot,{timeout:30000});
              await page.screenshot({path:'bowbrawl-menu.png',fullPage:true});
              const arenas=new Set(),winds=new Set();
              for(let i=0;i<5;i++){await page.locator('#startBtn').click();await page.waitForFunction(()=>window.__game.state.screen==='play');const s=await page.evaluate(()=>window.__game.getSnapshot());arenas.add(s.arena);winds.add(s.wind);await page.locator('#fireBtn').click();await page.evaluate(()=>window.__game.tick(420));await page.waitForTimeout(80);}
              assert(arenas.size>=4,'CRITIC FAIL: terrain variety is too low');
              assert(winds.size>=3,'CRITIC FAIL: wind variation is too low');
              await page.locator('#shopBtn').click();assert(await page.locator('#shopGrid').isVisible(),'CRITIC FAIL: armory does not open');
              assert((await page.locator('.shop-item').count())>=12,'CRITIC FAIL: progression catalogue too small');
              await page.locator('#shopClose').click();
              await page.locator('#startBtn').click();await page.waitForFunction(()=>window.__game.state.screen==='play');
              const before=await page.evaluate(()=>window.__game.getSnapshot());
              await page.locator('#fireBtn').click();await page.evaluate(()=>window.__game.tick(45));
              const during=await page.evaluate(()=>window.__game.getSnapshot());assert(during.shots===1,'CRITIC FAIL: projectile did not launch');
              await page.evaluate(()=>window.__game.tick(600));const after=await page.evaluate(()=>window.__game.getSnapshot());assert(after.turn==='player'||after.screen==='over','CRITIC FAIL: turn loop did not return to player');
              await page.screenshot({path:'bowbrawl-live.png',fullPage:true});
              await page.goto(base+'?autoplay=1&seed=777',{waitUntil:'load',timeout:60000});await page.waitForFunction(()=>window.__game.state.screen==='play',{timeout:30000});await page.evaluate(()=>window.__game.tick(900));const auto=await page.evaluate(()=>window.__game.getSnapshot());assert(auto.shots>=2||auto.screen==='over','CRITIC FAIL: AI duel loop is not progressing');await page.screenshot({path:'bowbrawl-autoplay.png',fullPage:true});
              assert.equal(errors.length,0,'CRITIC FAIL: browser errors: '+errors.join(' | '));
              console.log('CRITIC WOW GATE PASSED: '+arenas.size+' arenas, '+winds.size+' wind states, armory, projectile loop, AI loop, mobile-safe viewport.');
            }finally{server.kill();await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit the tested game to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/games/archer/main.js
          if git diff --cached --quiet; then echo 'No Bowbrawl source changes.'; else git commit -m 'Bowbrawl: ship v4 WOW pass'; git push origin HEAD:main; fi
      - name: Upload critic screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bowbrawl-wow-critic
          path: |
            bowbrawl-menu.png
            bowbrawl-live.png
            bowbrawl-autoplay.png
          if-no-files-found: warn
          retention-days: 14
