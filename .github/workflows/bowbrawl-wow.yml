name: Bowbrawl WOW critic

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_bowbrawl_v4.mjs'
      - 'tools/patch_bowbrawl_critic.mjs'
      - '.github/workflows/bowbrawl-wow.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bowbrawl-wow-main
  cancel-in-progress: true

jobs:
  overhaul-and-critic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Apply the complete v4 game pass
        run: node tools/patch_bowbrawl_v4.mjs
      - name: Apply visual and mechanics fixes from prior critic
        run: node tools/patch_bowbrawl_critic.mjs
      - name: JavaScript syntax gate
        run: node --check web/games/archer/main.js
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Harsh critic - gameplay and presentation gate
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const {spawn} = require('node:child_process');
          const fs = require('node:fs');
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:810},deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>m.type()==='error'&&errors.push(m.text()));
            const base='http://127.0.0.1:8080/games/archer/index.html';
            const server=spawn('node',['tools/serve.mjs','8080'],{stdio:['ignore','pipe','pipe']});
            let serverOutput=''; server.stdout.on('data',d=>serverOutput+=d); server.stderr.on('data',d=>serverOutput+=d);
            try{
              let ready=false;
              for(let i=0;i<80;i++){
                try{ const r=await fetch(base); if(r.ok){ready=true;break;} }catch{}
                await sleep(250);
              }
              assert(ready,'CRITIC INFRA FAIL: local game server did not become ready: '+serverOutput);
              await page.addInitScript(()=>localStorage.setItem('bowbrawl.progress.v4',JSON.stringify({points:2500,selected:{character:'raven',bow:'ashwood',arrow:'standard',outfit:'ronin'},owned:{characters:['raven','titan','vexa','sable'],bows:['ashwood','sunfang','moonpiercer'],arrows:['standard','ember','frost','storm'],outfits:['ronin','neon','royal','arctic']}})));
              await page.goto(base+'?seed=101',{waitUntil:'load',timeout:60000});
              await page.waitForFunction(()=>window.__game?.getSnapshot,{timeout:30000});
              await page.screenshot({path:'bowbrawl-menu.png',fullPage:true});
              const arenas=new Set(),winds=new Set(),distances=new Set();
              for(let i=0;i<6;i++){
                await page.locator('#startBtn').click();
                await page.waitForFunction(()=>window.__game.state.screen==='play');
                const s=await page.evaluate(()=>window.__game.getSnapshot());
                arenas.add(s.arena); winds.add(s.wind); distances.add(Math.round(s.distance));
                assert(s.turn==='player','CRITIC FAIL: match does not start on player turn');
                await page.locator('#fireBtn').click();
                await page.evaluate(()=>window.__game.tick(420));
                await page.waitForTimeout(80);
                await page.goto(base+'?seed='+(200+i),{waitUntil:'load',timeout:60000});
                await page.waitForFunction(()=>window.__game?.getSnapshot,{timeout:30000});
              }
              assert(arenas.size>=4,'CRITIC FAIL: terrain variety is too low: '+arenas.size);
              assert(winds.size>=3,'CRITIC FAIL: wind variation is too low: '+winds.size);
              assert(distances.size>=4,'CRITIC FAIL: combat distance variation is too low: '+distances.size);
              await page.locator('#startBtn').click(); await page.waitForFunction(()=>window.__game.state.screen==='play');
              const initial=await page.evaluate(()=>window.__game.getSnapshot());
              assert(initial.distance>0,'CRITIC FAIL: distance is missing');
              assert(initial.aimPreviewVisible===true&&initial.aimPoints>=2,'CRITIC FAIL: wind-aware trajectory preview is missing while aiming');
              const solution=await page.evaluate(()=>window.__game.aimSolution());
              await page.evaluate(s=>window.__game.setAim(s.angle,s.power),solution);
              await page.locator('#fireBtn').click(); await page.evaluate(()=>window.__game.tick(45));
              const flying=await page.evaluate(()=>window.__game.getSnapshot());
              assert(flying.shots===1,'CRITIC FAIL: projectile did not launch');
              assert(flying.projectileActive||flying.enemyHp<initial.enemyHp,'CRITIC FAIL: projectile vanished without hitting or remaining in flight');
              await page.evaluate(()=>window.__game.tick(900));
              const after=await page.evaluate(()=>window.__game.getSnapshot());
              assert(after.turn==='player'||after.screen==='over','CRITIC FAIL: turn loop did not return to player');
              assert(typeof after.wind==='number','CRITIC FAIL: wind is not exposed as gameplay state');
              assert(after.enemyHp<initial.enemyHp||after.enemyHits>0,'CRITIC FAIL: ballistics/aim solver did not produce a hit in the solved test shot');
              await page.screenshot({path:'bowbrawl-live.png',fullPage:true});
              await page.locator('#shopBtn').click();
              assert(await page.locator('#shopGrid').isVisible(),'CRITIC FAIL: armory does not open');
              assert((await page.locator('.shop-item').count())>=15,'CRITIC FAIL: progression catalogue too small');
              const shopText=await page.locator('#shopGrid').innerText();
              assert(/bow/i.test(shopText)&&/arrow/i.test(shopText)&&/outfit|character/i.test(shopText),'CRITIC FAIL: armory lacks meaningful equipment categories');
              await page.locator('.shop-item').filter({hasText:'VEXA'}).click();
              assert((await page.evaluate(()=>window.__game.getSnapshot())).playerCharacter==='female','CRITIC FAIL: Vexa purchase/equip does not change player silhouette to female');
              await page.locator('.shop-item').filter({hasText:'TITAN'}).click();
              assert((await page.evaluate(()=>window.__game.getSnapshot())).playerCharacter==='male','CRITIC FAIL: Titan purchase/equip does not change player silhouette to male');
              await page.locator('.shop-item').filter({hasText:'VEXA'}).click();
              await page.locator('#shopClose').click();
              await page.goto(base+'?autoplay=1&seed=777',{waitUntil:'load',timeout:60000});
              await page.waitForFunction(()=>window.__game?.state?.screen==='play',{timeout:30000});
              await page.evaluate(()=>window.__game.tick(900));
              const auto=await page.evaluate(()=>window.__game.getSnapshot());
              assert(auto.shots>=2||auto.screen==='over','CRITIC FAIL: AI duel loop is not progressing');
              await page.screenshot({path:'bowbrawl-autoplay.png',fullPage:true});
              await page.setViewportSize({width:844,height:390});
              await page.goto(base+'?seed=888',{waitUntil:'load',timeout:60000});
              await page.locator('#startBtn').click();
              await page.waitForFunction(()=>window.__game?.state?.screen==='play',{timeout:30000});
              const mobileCheck=await page.evaluate(()=>({width:innerWidth,scrollWidth:document.documentElement.scrollWidth,fire:document.querySelector('#fireBtn').getBoundingClientRect().toJSON(),canvas:document.querySelector('#c').getBoundingClientRect().toJSON(),heads:window.__game.getLayout().heads,hud:document.querySelector('.combat-hud').getBoundingClientRect().toJSON()}));
              await page.screenshot({path:'bowbrawl-mobile.png',fullPage:true});
              console.log('MOBILE FRAME DEBUG '+JSON.stringify({heads:mobileCheck.heads,hudTop:mobileCheck.hud.top,hudBottom:mobileCheck.hud.bottom,height:390,width:mobileCheck.width,fire:mobileCheck.fire}));
              assert(mobileCheck.scrollWidth<=mobileCheck.width+3,'CRITIC FAIL: mobile layout has horizontal overflow');
              assert(mobileCheck.fire.width>60&&mobileCheck.fire.height>28&&mobileCheck.fire.right<=mobileCheck.width+3,'CRITIC FAIL: mobile fire control is too small or clipped');
              assert(mobileCheck.heads.every(h=>h.y>mobileCheck.hud.bottom+2&&h.y<390-82),'CRITIC FAIL: mobile fighter heads overlap HUD/aim dock: '+JSON.stringify({heads:mobileCheck.heads,hudBottom:mobileCheck.hud.bottom,height:390}));
              await page.screenshot({path:'bowbrawl-mobile.png',fullPage:true});
              assert.equal(errors.length,0,'CRITIC FAIL: browser errors: '+errors.join(' | '));
              for(const f of ['bowbrawl-menu.png','bowbrawl-live.png','bowbrawl-autoplay.png','bowbrawl-mobile.png']) assert(fs.statSync(f).size>10000,'CRITIC FAIL: visual capture is suspiciously empty: '+f);
              console.log('CRITIC WOW GATE PASSED: '+arenas.size+' arenas, '+winds.size+' wind states, '+distances.size+' distances, armory, projectile physics, turn loop, AI duel, mobile-safe viewport.');
            }finally{server.kill();await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit the tested game to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/games/archer/main.js
          if git diff --cached --quiet; then echo 'No Bowbrawl source changes.'; else
            git commit -m 'Bowbrawl: ship v4 WOW pass'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload critic screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bowbrawl-wow-critic
          path: |
            bowbrawl-menu.png
            bowbrawl-live.png
            bowbrawl-autoplay.png
            bowbrawl-mobile.png
          if-no-files-found: warn
          retention-days: 14

  build-android-apk:
    needs: overhaul-and-critic
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the tested source from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35 packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build, validate and publish tested APK
        shell: bash
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          mkdir -p artifacts dist
          ARCADE_LOCKDIR="$RUNNER_TEMP" bash tools/apk.sh
          apk="dist/ClearplayArcade.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -q "assets/games/archer/index.html"
          unzip -p "$apk" assets/games/archer/index.html | grep -q "SKYFALL CIRCUIT"
          unzip -p "$apk" assets/games/archer/main.js | grep -q "hourglassProfile"
          unzip -p "$apk" assets/games/archer/main.js | grep -q "aimPreviewVisible"
          sha256sum "$apk" | tee artifacts/apk-sha256.txt
          cp "$apk" "$RUNNER_TEMP/ClearplayArcade-tested.apk"
          git fetch origin main
          if ! git diff --quiet "$build_sha" "origin/main" -- web/games/archer android tools/apk.sh tools/patch_bowbrawl_v4.mjs tools/patch_bowbrawl_critic.mjs package.json package-lock.json; then
            echo "Source/build inputs changed during APK creation; refusing to publish a stale binary."
            exit 1
          fi
          git reset --hard origin/main
          mkdir -p dist
          cp "$RUNNER_TEMP/ClearplayArcade-tested.apk" dist/ClearplayArcade.apk
          git add dist/ClearplayArcade.apk
          if git diff --cached --quiet; then
            echo "APK matches the tracked binary; no APK commit required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git commit -m "Build Clearplay Arcade APK with tested Bowbrawl"
            git push origin HEAD:main
          fi
          ls -lh dist/ClearplayArcade.apk
      - name: Upload tested Android package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bowbrawl-tested-android-apk
          path: |
            dist/ClearplayArcade.apk
            artifacts/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
